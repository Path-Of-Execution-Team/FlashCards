apiVersion: 1

# Same two datasources as https://grafana.bosman.top, pointed at the containers
# in this stack. Names match production so a dashboard exported from there can
# be dropped into docker/grafana/dashboards/ without rewiring its datasource
# references.
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
