# =============================================================================
#  FlashCards - full local development stack
#
#    docker compose watch          start everything, sync code on save
#    docker compose logs -f backend
#    docker compose down           stop, keep the data volumes
#    docker compose down -v        stop and wipe every volume
#
#  See docker/README.md for ports, credentials and the watch rules.
#
#  This file is for development only. Production runs on k3s from k8s/overlays/*
#  and never uses these images: the Dockerfiles under docker/ keep Maven and the
#  JDK in the final layer so a container restart can recompile, which is the
#  opposite of what the shipped images do.
#
#  Image versions are pinned to the ones in ansible/group_vars/all.yml and
#  INFRASTRUCTURE.md, so a bug that only reproduces on a specific PostgreSQL or
#  Kafka release reproduces here too.
# =============================================================================
name: flashcards

# -----------------------------------------------------------------------------
#  Shared fragments
# -----------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The two Spring services read the same JVM sizing. Small heaps on purpose: the
# whole stack has to fit next to an IDE.
x-jvm-opts: &jvm-opts
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=70.0
    -XX:+ExitOnOutOfMemoryError
    -Djava.security.egd=file:/dev/./urandom

services:
  # ===========================================================================
  #  Data stores
  # ===========================================================================
  postgres:
    image: postgres:18.3-bookworm
    container_name: flashcards-postgres
    restart: unless-stopped
    environment:
      # k8s/db/bootstrap-flashcards-db.sql creates this role and database on the
      # shared cluster instance. Locally the entrypoint does the same job, and
      # POSTGRES_USER already owns POSTGRES_DB, so no init script is needed.
      POSTGRES_DB: ${POSTGRES_DB:-flashcards}
      POSTGRES_USER: ${POSTGRES_USER:-flashcards_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeMeStrong123}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # /var/lib/postgresql, not /var/lib/postgresql/data: since 18 the image
      # keeps its data in a major-version subdirectory so that pg_upgrade --link
      # can work, and it refuses to start if the mount sits on the old path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flashcards_user} -d ${POSTGRES_DB:-flashcards}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  kafka:
    image: apache/kafka:4.3.1
    container_name: flashcards-kafka
    restart: unless-stopped
    environment:
      # Single-node KRaft: one process is both broker and controller. Mirrors
      # ansible/roles/datastores/templates/kafka.yaml.j2, down to the cluster id.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is what the other containers use; PLAINTEXT_HOST exists only so
      # kafkacat / an IDE consumer on the host can reach the broker, because an
      # advertised listener can carry exactly one reachable address.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "3"
      # Without this a single consumer waits 3s before its first poll returns.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # flashcards-demo-topic is never declared anywhere; the producer creates it.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging: *default-logging

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: flashcards-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      # No BasicAuth here on purpose; the cluster deployment has it
      # (kafka_ui_basic_auth_secret) because it is exposed on a public hostname.
      AUTH_TYPE: DISABLED
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    logging: *default-logging

  # Catches everything FlashCardsHostedServices sends, so no local run can leak
  # a real email. SMTP on 1025, web inbox on ${MAILPIT_UI_PORT}.
  mailpit:
    image: axllent/mailpit:v1.28
    container_name: flashcards-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit-data:/data
    logging: *default-logging

  # ===========================================================================
  #  Applications
  # ===========================================================================
  backend:
    build:
      context: ./source/FlashCardsBackend
      dockerfile: ../../docker/backend/Dockerfile.dev
    container_name: flashcards-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Read by logback-spring.xml. The pod/node fields have no meaning outside
      # Kubernetes but the encoder emits them either way, so they get honest
      # values instead of "unknown".
      APP_NAME: backend
      POD_NAMESPACE: flashcards
      POD_NAME: backend-local
      NODE_NAME: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flashcards}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flashcards_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeMeStrong123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      # application.properties hardcodes a jwt.secret; relaxed binding lets this
      # environment variable outrank it, which is why the committed value never
      # signs a token you actually run with.
      JWT_SECRET: ${JWT_SECRET:-localDevSecretNotUsedAnywhereElse0123456789abcdef}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      # The browser only ever talks to the frontend origin, but Swagger UI and
      # curl hit :8080 directly, so both are allowed.
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:${BACKEND_PORT:-8080}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: flashcards-backend
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_PRODUCER_ACKS: all
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # A cold `mvn spring-boot:run` has to resolve plugins before it compiles.
      start_period: 180s
    logging: *default-logging
    develop:
      watch:
        # sync+restart, not plain sync: Java is compiled, so the container has to
        # re-run `mvn spring-boot:run` for a source change to take effect. target/
        # survives the restart, so the recompile is incremental (seconds, not the
        # full build).
        - action: sync+restart
          path: ./source/FlashCardsBackend/src
          target: /app/src
        # A dependency change cannot be synced - the image layer that primed
        # ~/.m2 has to be rebuilt.
        - action: rebuild
          path: ./source/FlashCardsBackend/pom.xml

  hosted:
    build:
      context: ./source/FlashCardsHostedServices
      dockerfile: ../../docker/hosted/Dockerfile.dev
    container_name: flashcards-hosted
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8081"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      APP_NAME: hosted
      POD_NAMESPACE: flashcards
      POD_NAME: hosted-local
      NODE_NAME: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: hosted-service-group
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      APP_KAFKA_DEMO_TOPIC: ${APP_KAFKA_DEMO_TOPIC:-flashcards-demo-topic}
      # Mailpit accepts anything and delivers nowhere - see the mailpit service.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
    ports:
      - "${HOSTED_PORT:-8081}:8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    logging: *default-logging
    develop:
      watch:
        - action: sync+restart
          path: ./source/FlashCardsHostedServices/src
          target: /app/src
        - action: rebuild
          path: ./source/FlashCardsHostedServices/pom.xml

  frontend:
    build:
      context: ./source/FlashCardsGUI
      dockerfile: ../../docker/frontend/Dockerfile.dev
    container_name: flashcards-frontend
    depends_on:
      backend:
        # Deliberately not service_healthy: `next dev` should come up even when
        # the backend is broken, otherwise a backend compile error blocks all
        # frontend work.
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      # Read by src/app/api/log-to-loki/route.ts for the structured log fields.
      APP_NAME: frontend
      POD_NAMESPACE: flashcards
      POD_NAME: frontend-local
      NODE_NAME: docker
      METRICS_PREFIX: frontend_
      METRICS_BUCKETS: ${METRICS_BUCKETS:-50,100,300,1000,2000,3000}
      # host:port with no scheme - next.config.ts builds the rewrite target as
      # http://${NEXT_PUBLIC_API_URL}/api/:path*. Adding https:// here produces
      # http://https://backend:8080 and every API call 500s.
      NEXT_PUBLIC_API_URL: backend:8080
      # Fallback for hosts where the container never sees inotify events for the
      # files compose syncs in and Fast Refresh goes quiet. Costs CPU; off by default.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Next's dev build cache. Survives restarts so a recreate does not pay for
      # a full cold compile. Wipe with:
      #   docker volume rm flashcards_frontend-next
      - frontend-next:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *default-logging
    develop:
      watch:
        # Plain sync - Fast Refresh picks these up without restarting anything.
        - action: sync
          path: ./source/FlashCardsGUI/src
          target: /app/src
        - action: sync
          path: ./source/FlashCardsGUI/messages
          target: /app/messages
        - action: sync
          path: ./source/FlashCardsGUI/public
          target: /app/public
        # next.config.ts is read once at boot, so it needs the restart.
        - action: sync+restart
          path: ./source/FlashCardsGUI/next.config.ts
          target: /app/next.config.ts
        # node_modules lives in the image, so a manifest change means a rebuild.
        - action: rebuild
          path: ./source/FlashCardsGUI/package.json
        - action: rebuild
          path: ./source/FlashCardsGUI/package-lock.json

  # ===========================================================================
  #  Observability - same components and versions as INFRASTRUCTURE.md section 6
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: flashcards-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.4
    container_name: flashcards-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: flashcards-alloy
    restart: unless-stopped
    depends_on:
      - loki
    # Reading /var/run/docker.sock needs the docker group, whose gid differs per
    # host. root is the portable answer for a local dev stack; the socket is
    # mounted read-only.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.1
    container_name: flashcards-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Skips the login screen entirely - this instance has no data worth gating.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging: *default-logging

volumes:
  postgres-data:
  kafka-data:
  mailpit-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  frontend-next:

networks:
  default:
    name: flashcards
