- name: Bootstrap Python on fresh Ubuntu hosts
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure Python 3 is present for Ansible modules
      ansible.builtin.raw: test -x /usr/bin/python3 || (sudo apt-get update && sudo apt-get install -y python3)
      changed_when: false

- name: Provision FlashCards Kubernetes infrastructure
  hosts: all
  gather_facts: true
  roles:
    - preflight
    - k3s
    - helm
    - traefik
    - cert_manager
    - vault
    - datastores
    - app_namespace
    - app_bootstrap
