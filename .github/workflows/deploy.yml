name: Deploy

# main    -> production, 57.129.66.163 (ssh ovh),  namespace moomento
# develop -> develop,    57.128.251.9  (ssh ovh2), namespace moomento-dev
#
# Which image tags get deployed
# ----------------------------
# This repository pins each subproject to an exact commit via git submodules,
# and each subproject's CI publishes ghcr.io/<owner>/<image>:sha-<short-sha>.
# So the tag to deploy is derivable from the submodule pointer - no manual
# version bookkeeping, and the deployed state always matches this commit.
#
# repository_dispatch (sent by a subproject after it publishes an image or a PR
# preview image) and workflow_dispatch can override individual tags.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [develop, production]
      source_ref:
        description: "Branch, tag or SHA to deploy (default: branch selected in the workflow UI)"
        required: false
        type: string
      deploy_services:
        description: "Services to deploy: all or comma-separated backend,frontend,hosted"
        required: false
        default: all
        type: string
      backend_tag:
        description: "Override backend tag (default: from submodule pointer)"
        required: false
        type: string
      frontend_tag:
        description: "Override frontend tag (default: from submodule pointer)"
        required: false
        type: string
      hosted_tag:
        description: "Override hosted tag (default: from submodule pointer)"
        required: false
        type: string
  repository_dispatch:
    types: [image-published]

permissions:
  contents: read
  packages: read

# Never run two deploys against the same environment at once, and never cancel
# one half-way through a rollout.
concurrency:
  group: deploy-${{ github.event.inputs.environment || github.event.client_payload.environment || github.ref }}
  cancel-in-progress: false

env:
  KUSTOMIZE_VERSION: v5.7.1
  KUBECONFORM_VERSION: 0.8.0

jobs:
  # ---------------------------------------------------------------------------
  # Works out which environment this run targets, and which image tag each
  # service should get. Kept separate so the result is visible in the run
  # summary before anything touches a server.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      ref: ${{ steps.target.outputs.ref }}
      requested_services: ${{ steps.target.outputs.requested_services }}
      manual_deploy: ${{ steps.target.outputs.manual_deploy }}
      backend_tag: ${{ steps.tags.outputs.backend }}
      frontend_tag: ${{ steps.tags.outputs.frontend }}
      hosted_tag: ${{ steps.tags.outputs.hosted }}
    steps:
      # Deliberately before the checkout: this step only reads the event
      # context, and its `ref` output decides what the checkout below fetches.
      - id: target
        name: Pick environment and ref from the trigger
        run: |
          set -euo pipefail
          services=all
          manual_deploy=false
          case "${{ github.event_name }}" in
            workflow_dispatch)
              manual_deploy=true
              env_name="${{ github.event.inputs.environment }}"
              ref="${{ github.event.inputs.source_ref }}"
              # Empty means "use the branch selected in GitHub's Run workflow UI".
              [ -n "$ref" ] || ref="${{ github.ref_name }}"
              services="${{ github.event.inputs.deploy_services }}" ;;
            repository_dispatch)
              env_name="${{ github.event.client_payload.environment }}"
              [ -n "$env_name" ] || env_name=develop
              services="${{ github.event.client_payload.deploy_services }}"
              [ -n "$services" ] || services="${{ github.event.client_payload.service }}"
              [ -n "$services" ] || services=all
              # A repository_dispatch always runs against the default branch,
              # so github.ref_name is `main` no matter which environment the
              # payload names. Checking out `main` for a develop deploy would
              # pin the two services NOT named in the payload to main's
              # submodule commits - i.e. ship production images to the dev
              # cluster. Derive the branch from the environment instead.
              case "$env_name" in
                production) ref=main ;;
                develop)    ref=develop ;;
                *) echo "::error::client_payload.environment '$env_name' is neither production nor develop"; exit 1 ;;
              esac ;;
            push)
              ref="${{ github.ref_name }}"
              case "$ref" in
                main)    env_name=production ;;
                develop) env_name=develop ;;
                *) echo "::error::branch $ref has no environment"; exit 1 ;;
              esac ;;
            *) echo "::error::unsupported event ${{ github.event_name }}"; exit 1 ;;
          esac

          services="${services//[[:space:]]/}"
          [ -n "$services" ] || services=all
          normalized=""
          append_service() {
            case " $normalized " in
              *" $1 "*) ;;
              *) normalized="${normalized:+$normalized }$1" ;;
            esac
          }
          if [ "$services" = "all" ]; then
            append_service backend
            append_service frontend
            append_service hosted
          else
            IFS=',' read -ra requested_services <<< "$services"
            for service in "${requested_services[@]}"; do
              case "$service" in
                backend|frontend|hosted) append_service "$service" ;;
                *) echo "::error::deploy_services contains '$service'; use all or comma-separated backend,frontend,hosted"; exit 1 ;;
              esac
            done
          fi
          [ -n "$normalized" ] || { echo "::error::deploy_services resolved to an empty set"; exit 1; }

          {
            echo "environment=$env_name"
            echo "ref=$ref"
            echo "requested_services=$normalized"
            echo "manual_deploy=$manual_deploy"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Deploying **$ref** to **$env_name**"
            echo
            echo "Requested services: \`$normalized\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        # Submodules are NOT cloned: the gitlink SHA is read straight out of the
        # tree, which is all that is needed and avoids three extra clones.
        with:
          ref: ${{ steps.target.outputs.ref }}
          submodules: false

      - id: tags
        name: Derive image tags from submodule pointers
        run: |
          set -euo pipefail
          # git ls-tree prints the commit each submodule is pinned to. The image
          # tag format comes from docker/metadata-action's
          # `type=sha,prefix=sha-,format=short`, which is 7 hex characters.
          pinned() {
            git ls-tree HEAD "$1" | awk '{print $3}' | cut -c1-7
          }

          backend="${{ github.event.inputs.backend_tag }}"
          frontend="${{ github.event.inputs.frontend_tag }}"
          hosted="${{ github.event.inputs.hosted_tag }}"

          # A repository_dispatch names exactly one service and its fresh tag.
          case "${{ github.event.client_payload.service }}" in
            backend)  backend="${{ github.event.client_payload.tag }}" ;;
            frontend) frontend="${{ github.event.client_payload.tag }}" ;;
            hosted)   hosted="${{ github.event.client_payload.tag }}" ;;
          esac

          [ -n "$backend" ]  || backend="sha-$(pinned source/FlashCardsBackend)"
          [ -n "$frontend" ] || frontend="sha-$(pinned source/FlashCardsGUI)"
          [ -n "$hosted" ]   || hosted="sha-$(pinned source/FlashCardsHostedServices)"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "hosted=$hosted"
          } >> "$GITHUB_OUTPUT"

          {
            echo
            echo "| service | tag |"
            echo "|---|---|"
            echo "| backend | \`$backend\` |"
            echo "| frontend | \`$frontend\` |"
            echo "| hosted | \`$hosted\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Chooses the actual deploy set. Manual runs use the operator's selection
  # exactly. Automatic subproject dispatches deploy the changed service and, on
  # a fresh or incomplete environment, any missing services whose branch images
  # are already available in GHCR.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan services
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    outputs:
      deploy_services: ${{ steps.scope.outputs.deploy_services }}
      needs_vault: ${{ steps.scope.outputs.needs_vault }}
      backend_tag: ${{ steps.scope.outputs.backend_tag }}
      frontend_tag: ${{ steps.scope.outputs.frontend_tag }}
      hosted_tag: ${{ steps.scope.outputs.hosted_tag }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?repository secret SSH_PRIVATE_KEY is not set}"
          : "${SSH_KNOWN_HOSTS:?repository variable SSH_KNOWN_HOSTS is not set}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host target
            HostName ${{ vars.SSH_HOST }}
            User ${{ vars.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - id: deployed
        name: Discover already deployed services
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        run: |
          set -euo pipefail
          deployed="$(
            ssh target "
              set -eu
              if ! command -v kubectl >/dev/null 2>&1; then
                exit 0
              fi
              for service in backend frontend hosted; do
                if kubectl -n '$K8S_NAMESPACE' get deployment \"\$service\" >/dev/null 2>&1; then
                  printf '%s ' \"\$service\"
                fi
              done
            " 2>/dev/null || true
          )"
          deployed="$(printf '%s' "$deployed" | xargs)"
          echo "deployed_services=$deployed" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "Already deployed services: \`${deployed:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: scope
        name: Pick deployable services
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBPROJECT_WORKFLOW_TOKEN: ${{ secrets.SUBPROJECT_WORKFLOW_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          REQUESTED_SERVICES: ${{ needs.resolve.outputs.requested_services }}
          MANUAL_DEPLOY: ${{ needs.resolve.outputs.manual_deploy }}
          DEPLOYED_SERVICES: ${{ steps.deployed.outputs.deployed_services }}
          DISPATCH_SERVICE: ${{ github.event.client_payload.service }}
          BACKEND_TAG: ${{ needs.resolve.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.resolve.outputs.frontend_tag }}
          HOSTED_TAG: ${{ needs.resolve.outputs.hosted_tag }}
        run: |
          set -euo pipefail

          owner_lc="${OWNER,,}"
          backend_tag="$BACKEND_TAG"
          frontend_tag="$FRONTEND_TAG"
          hosted_tag="$HOSTED_TAG"

          branch_for_environment() {
            case "$ENVIRONMENT" in
              production) printf 'main' ;;
              develop)    printf 'develop' ;;
              *) echo "::error::Unsupported environment for image build: $ENVIRONMENT"; exit 1 ;;
            esac
          }
          repo_for() {
            case "$1" in
              backend)  printf '%s/FlashCardsBackend' "$OWNER" ;;
              frontend) printf '%s/FlashCardsGUI' "$OWNER" ;;
              hosted)   printf '%s/FlashCardsHostedServices' "$OWNER" ;;
              *) return 1 ;;
            esac
          }
          image_for() {
            case "$1" in
              backend)  printf 'ghcr.io/%s/flashcards-backend' "$owner_lc" ;;
              frontend) printf 'ghcr.io/%s/flashcards-gui' "$owner_lc" ;;
              hosted)   printf 'ghcr.io/%s/flashcards-hosted' "$owner_lc" ;;
              *) return 1 ;;
            esac
          }
          tag_for() {
            case "$1" in
              backend)  printf '%s' "$backend_tag" ;;
              frontend) printf '%s' "$frontend_tag" ;;
              hosted)   printf '%s' "$hosted_tag" ;;
              *) return 1 ;;
            esac
          }
          set_tag() {
            case "$1" in
              backend)  backend_tag="$2" ;;
              frontend) frontend_tag="$2" ;;
              hosted)   hosted_tag="$2" ;;
              *) return 1 ;;
            esac
          }
          require_subproject_token() {
            if [ -z "$SUBPROJECT_WORKFLOW_TOKEN" ]; then
              echo "::error::SUBPROJECT_WORKFLOW_TOKEN is required to build missing subproject images."
              echo "::error::Create a fine-grained PAT for the three subproject repos with Actions: read/write and Contents: read."
              exit 1
            fi
          }
          branch_tag_for() {
            local service="$1" repo branch sha
            repo="$(repo_for "$service")"
            branch="$(branch_for_environment)"
            require_subproject_token
            sha="$(GH_TOKEN="$SUBPROJECT_WORKFLOW_TOKEN" gh api "repos/${repo}/commits/${branch}" --jq .sha)"
            printf 'sha-%s' "${sha:0:7}"
          }
          image_exists() {
            local image="$1" tag="$2" repo token code
            repo="${image#ghcr.io/}"
            token=$(curl -sSf -u "$GHCR_USER:$GHCR_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | jq -r .token)
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}")
            [ "$code" = "200" ]
          }
          image_exists_with_retry() {
            local image="$1" tag="$2"
            for _ in 1 2 3 4 5; do
              image_exists "$image" "$tag" && return 0
              sleep 5
            done
            return 1
          }
          ensure_branch_image() {
            local service="$1" image="$2" tag="$3" repo branch
            if image_exists "$image" "$tag"; then
              return
            fi

            repo="$(repo_for "$service")"
            branch="$(branch_for_environment)"
            require_subproject_token
            echo "Image $image:$tag is missing; triggering $repo docker-publish.yml on $branch."
            GH_TOKEN="$SUBPROJECT_WORKFLOW_TOKEN" gh workflow run docker-publish.yml \
              --repo "$repo" \
              --ref "$branch"

            for _ in $(seq 1 60); do
              if image_exists "$image" "$tag"; then
                return
              fi
              sleep 20
            done

            echo "::error::Timed out waiting for $image:$tag after triggering $repo docker-publish.yml"
            exit 1
          }
          contains() {
            local haystack="$1" needle="$2"
            case " $haystack " in
              *" $needle "*) return 0 ;;
              *) return 1 ;;
            esac
          }
          append_candidate() {
            contains "$candidates" "$1" || candidates="${candidates:+$candidates }$1"
          }
          append_missing() {
            contains "$missing_services" "$1" || missing_services="${missing_services:+$missing_services }$1"
          }
          append_selected() {
            contains "$selected" "$1" || selected="${selected:+$selected }$1"
          }

          candidates="$REQUESTED_SERVICES"
          missing_services=""
          for service in backend frontend hosted; do
            if ! contains "$DEPLOYED_SERVICES" "$service"; then
              append_missing "$service"
            fi
          done

          if [ "$MANUAL_DEPLOY" = "true" ]; then
            echo "Manual deploy: using requested services as-is." >> "$GITHUB_STEP_SUMMARY"
          else
            for service in $missing_services; do
              append_candidate "$service"
            done
            {
              echo
              echo "Missing services considered for first deploy: \`${missing_services:-none}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          selected=""
          {
            echo
            echo "| service | image | deploy? |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for service in backend frontend hosted; do
            contains "$candidates" "$service" || continue
            image="$(image_for "$service")"

            if [ "$MANUAL_DEPLOY" != "true" ] \
              && contains "$missing_services" "$service" \
              && [ "$service" != "$DISPATCH_SERVICE" ]; then
              tag="$(branch_tag_for "$service")"
              set_tag "$service" "$tag"
              ensure_branch_image "$service" "$image" "$tag"
              append_selected "$service"
              verdict="yes, built if missing"
              echo "| $service | \`$image:$tag\` | $verdict |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            tag="$(tag_for "$service")"

            if image_exists "$image" "$tag"; then
              append_selected "$service"
              verdict="yes"
            elif [ "$service" = "$DISPATCH_SERVICE" ]; then
              if image_exists_with_retry "$image" "$tag"; then
                append_selected "$service"
                verdict="yes"
              else
                echo "::error::Dispatched service $service image is not available in GHCR: $image:$tag"
                exit 1
              fi
            elif [ "$MANUAL_DEPLOY" = "true" ]; then
              echo "::error::Requested service $service image is not available in GHCR: $image:$tag"
              exit 1
            else
              verdict="not yet"
            fi
            echo "| $service | \`$image:$tag\` | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done

          [ -n "$selected" ] || {
            echo "::error::None of the candidate images exist in GHCR yet; nothing can be deployed."
            exit 1
          }

          needs_vault=false
          case " $selected " in
            *" backend "*|*" hosted "*) needs_vault=true ;;
          esac

          {
            echo "deploy_services=$selected"
            echo "needs_vault=$needs_vault"
            echo "backend_tag=$backend_tag"
            echo "frontend_tag=$frontend_tag"
            echo "hosted_tag=$hosted_tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo
            echo "Deployable services: \`$selected\`"
            echo "Requires Vault unsealed: \`$needs_vault\`"
            echo
            echo "| final service | tag |"
            echo "|---|---|"
            echo "| backend | \`$backend_tag\` |"
            echo "| frontend | \`$frontend_tag\` |"
            echo "| hosted | \`$hosted_tag\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Converges the target node before app manifests are rendered and applied.
  # The called workflow runs in safe CI mode: it verifies Vault is unsealed but
  # does not initialise or unseal it unless manually started with that input.
  # ---------------------------------------------------------------------------
  provision:
    name: Provision target infrastructure
    needs: [resolve, plan]
    uses: ./.github/workflows/provision.yml
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      ref: ${{ needs.resolve.outputs.ref }}
      vault_bootstrap: false
      vault_required_unsealed: ${{ needs.plan.outputs.needs_vault == 'true' }}
      app_bootstrap: ${{ needs.plan.outputs.needs_vault == 'true' }}
      app_bootstrap_require_credentials: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Renders the overlay and schema-checks it. No cluster and no credentials are
  # involved, so a broken manifest fails here rather than half-way through a
  # rollout.
  # ---------------------------------------------------------------------------
  render:
    name: Render and validate manifests
    needs: [resolve, plan, provision]
    runs-on: ubuntu-latest
    steps:
      # Same ref the tags were derived from, so the overlay and the image tags
      # come from one commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kustomize version
          kubeconform -v

      - name: Set image tags
        working-directory: k8s/overlays/${{ needs.resolve.outputs.environment }}
        run: |
          set -euo pipefail
          kustomize edit set image \
            "flashcards-backend=*:${{ needs.plan.outputs.backend_tag }}" \
            "flashcards-frontend=*:${{ needs.plan.outputs.frontend_tag }}" \
            "flashcards-hosted=*:${{ needs.plan.outputs.hosted_tag }}"

      - name: Render
        run: |
          set -euo pipefail
          kustomize build "k8s/overlays/${{ needs.resolve.outputs.environment }}" > rendered-full.yaml
          echo "rendered $(grep -c '^kind:' rendered-full.yaml) resources"

      - name: Select resources for the requested services
        env:
          DEPLOY_SERVICES: ${{ needs.plan.outputs.deploy_services }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import os
          import sys
          import yaml
          from collections import Counter

          selected = set(os.environ["DEPLOY_SERVICES"].split())
          docs = [doc for doc in yaml.safe_load_all(open("rendered-full.yaml", encoding="utf-8")) if doc]

          def ingress_backend_services(doc):
              services = set()
              for rule in doc.get("spec", {}).get("rules", []):
                  for path in rule.get("http", {}).get("paths", []):
                      service = path.get("backend", {}).get("service", {}).get("name")
                      if service:
                          services.add(service)
              return services

          def include(doc):
              kind = doc.get("kind")
              name = doc.get("metadata", {}).get("name")

              if kind in {"Namespace", "ConfigMap", "NetworkPolicy"}:
                  return True
              if kind == "Middleware":
                  return "frontend" in selected
              if kind == "ServiceAccount":
                  return name in selected
              if kind in {"Deployment", "HorizontalPodAutoscaler", "ServiceMonitor"}:
                  return name in selected
              if kind == "Service":
                  # Frontend can be deployed before backend. Keeping the backend
                  # Service makes backend:8080 resolvable, just with no endpoints.
                  return name in selected or ("frontend" in selected and name == "backend")
              if kind == "Ingress":
                  return bool(ingress_backend_services(doc) & selected)
              return False

          output = [doc for doc in docs if include(doc)]
          if not output:
              print("No resources selected", file=sys.stderr)
              sys.exit(1)

          with open("rendered.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump_all(output, f, sort_keys=False)

          print(f"selected {len(output)} of {len(docs)} resources for: {', '.join(sorted(selected))}")
          print("kinds:", dict(sorted(Counter(doc["kind"] for doc in output).items())))
          PY

      - name: Validate against the Kubernetes schemas
        run: |
          set -euo pipefail
          # -strict rejects unknown fields; the CRDs-catalog location resolves
          # ServiceMonitor and Traefik's Middleware, which are not in the
          # built-in schema set. Skipped resources are treated as a failure so
          # an unresolvable CRD cannot pass silently.
          kubeconform -summary -strict \
            -kubernetes-version 1.32.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml | tee summary.txt
          grep -q 'Invalid: 0, Errors: 0, Skipped: 0' summary.txt

      - name: Confirm every image tag exists in GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Catches "the subproject's build has not finished / never ran" before
          # the cluster turns it into an ImagePullBackOff.
          fail=0
          while read -r image; do
            repo="${image%:*}"; repo="${repo#ghcr.io/}"
            tag="${image##*:}"
            token=$(curl -sSf -u "$GHCR_USER:$GHCR_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | jq -r .token)
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}")
            if [ "$code" = "200" ]; then
              echo "  ok      $image"
            else
              echo "::error::$image is not in GHCR (HTTP $code) - has its build workflow finished?"
              fail=1
            fi
          done < <(grep -oE 'ghcr\.io/[a-z0-9._/-]+:[A-Za-z0-9._-]+' rendered.yaml | sort -u)
          exit "$fail"

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ needs.resolve.outputs.environment }}
          path: rendered.yaml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Applies the rendered manifests over SSH. The kubeconfig never leaves the
  # node: kubectl runs there, we only ship one YAML file.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ needs.resolve.outputs.environment }}
    needs: [resolve, plan, render]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rendered-${{ needs.resolve.outputs.environment }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?repository secret SSH_PRIVATE_KEY is not set}"
          : "${SSH_KNOWN_HOSTS:?repository variable SSH_KNOWN_HOSTS is not set}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host keys, so StrictHostKeyChecking stays on and a hijacked
          # DNS record cannot hand this key to someone else's server.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host target
            HostName ${{ vars.SSH_HOST }}
            User ${{ vars.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Check the cluster is reachable
        run: |
          set -euo pipefail
          ssh target 'kubectl version -o json >/dev/null && kubectl get nodes'

      - name: Check Vault is unsealed
        if: needs.plan.outputs.needs_vault == 'true'
        run: |
          set -euo pipefail
          # Vault standalone comes back sealed after a reboot, and the pods would
          # then hang in Init with no obvious cause. Say so up front.
          if ! ssh target 'kubectl -n vault exec vault-0 -- vault status -format=json' | grep -q '"sealed": *false'; then
            echo "::error::Vault on ${{ vars.SSH_HOST }} is sealed - unseal it first: kubectl -n vault exec -it vault-0 -- vault operator unseal"
            exit 1
          fi

      - name: Ensure the namespace and the GHCR pull secret exist
        env:
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          : "${GHCR_PULL_USER:?repository variable GHCR_PULL_USER is not set}"
          : "${GHCR_PULL_TOKEN:?repository secret GHCR_PULL_TOKEN is not set}"
          ns='${{ vars.K8S_NAMESPACE }}'
          # shellcheck disable=SC2029
          ssh target "kubectl create namespace '$ns' --dry-run=client -o yaml | kubectl apply -f -"
          # Refreshed on every deploy so a rotated token cannot leave the
          # cluster unable to pull on the next pod restart. The token travels
          # over the SSH stream rather than being written to a file on the node
          # or echoed into the workflow log.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_PULL_TOKEN" | ssh target "
            set -eu
            token=\$(cat)
            kubectl -n '$ns' create secret docker-registry ghcr-pull \
              --docker-server=ghcr.io \
              --docker-username='$GHCR_PULL_USER' \
              --docker-password=\"\$token\" \
              --dry-run=client -o yaml | kubectl apply -f -" >/dev/null

      - name: Copy the rendered manifests
        run: |
          set -euo pipefail
          scp rendered.yaml target:/tmp/flashcards-deploy.yaml

      - name: Server-side dry run
        run: |
          set -euo pipefail
          # INFRASTRUCTURE.md rule 12: validate against the live API before
          # applying. Catches missing CRDs, admission webhook rejections and
          # immutable-field changes that offline schema checks cannot see.
          ssh target 'kubectl apply --dry-run=server -f /tmp/flashcards-deploy.yaml'

      - name: Apply
        run: |
          set -euo pipefail
          # --force-conflicts is needed the first time a resource that was
          # applied client-side is taken over by this field manager.
          #
          # No `rollout restart` afterwards: app-config carries kustomize's name
          # suffix hash, so a changed config value changes the pod template and
          # rolls the pods by itself. Adding a restart here would trigger a
          # second, redundant rollout on top of the first.
          ssh target 'kubectl apply --server-side --force-conflicts \
            --field-manager=github-actions \
            -f /tmp/flashcards-deploy.yaml'

      - name: Wait for the rollout
        id: rollout
        env:
          DEPLOY_SERVICES: ${{ needs.plan.outputs.deploy_services }}
        run: |
          set -euo pipefail
          for d in $DEPLOY_SERVICES; do
            echo "::group::rollout $d"
            # shellcheck disable=SC2029
            ssh target "kubectl -n ${{ vars.K8S_NAMESPACE }} rollout status deployment/$d --timeout=8m"
            echo "::endgroup::"
          done

      - name: Diagnostics and rollback on failure
        if: failure()
        env:
          DEPLOY_SERVICES: ${{ needs.plan.outputs.deploy_services }}
        run: |
          set +e
          ns='${{ vars.K8S_NAMESPACE }}'
          echo "::group::pods"
          # shellcheck disable=SC2029
          ssh target "kubectl -n $ns get pods -o wide"
          echo "::endgroup::"
          echo "::group::events"
          # shellcheck disable=SC2029
          ssh target "kubectl -n $ns get events --sort-by=.lastTimestamp | tail -40"
          echo "::endgroup::"
          for d in $DEPLOY_SERVICES; do
            echo "::group::logs $d"
            # shellcheck disable=SC2029
            ssh target "kubectl -n $ns logs deployment/$d -c application --tail=100"
            # Empty for the frontend, which has no Vault sidecar.
            # shellcheck disable=SC2029
            ssh target "kubectl -n $ns logs deployment/$d -c vault-agent-init --tail=30 2>/dev/null"
            echo "::endgroup::"
          done
          echo "::group::rollback"
          for d in $DEPLOY_SERVICES; do
            # shellcheck disable=SC2029
            ssh target "kubectl -n $ns rollout undo deployment/$d"
          done
          for d in $DEPLOY_SERVICES; do
            # shellcheck disable=SC2029
            ssh target "kubectl -n $ns rollout status deployment/$d --timeout=5m"
          done
          echo "::endgroup::"
          echo "::warning::rollout failed; all three deployments were rolled back to the previous revision"

      - name: Clean up
        if: always()
        run: ssh target 'rm -f /tmp/flashcards-deploy.yaml' || true

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed to ${{ needs.resolve.outputs.environment }}"
            echo
            echo "- host: \`${{ vars.SSH_HOST }}\`"
            echo "- namespace: \`${{ vars.K8S_NAMESPACE }}\`"
            echo "- url: https://${{ vars.PUBLIC_HOST }}"
            echo "- services: \`${{ needs.plan.outputs.deploy_services }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
