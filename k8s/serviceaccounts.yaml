# One ServiceAccount per workload. Vault Kubernetes auth roles are bound to
# these names, so renaming a ServiceAccount requires updating the matching
# Vault role (see vault/bootstrap-vault.example.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
# The Vault Agent sidecar needs the projected token to log in to Vault.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hosted
automountServiceAccountToken: true
