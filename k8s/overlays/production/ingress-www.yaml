apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-www
  labels:
    app: frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.moomento.pl
      secretName: frontend-www-tls
  rules:
    - host: www.moomento.pl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-www-metrics-deny
  labels:
    app: frontend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: moomento-deny-public@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.moomento.pl
      secretName: frontend-www-tls
  rules:
    - host: www.moomento.pl
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
