# =============================================================================
#  DEVELOP  -  develop branch  ->  57.128.251.9 (ssh ovh2)
#
#  THIS IS THE ONLY FILE YOU NORMALLY EDIT FOR THIS ENVIRONMENT.
#
#  Differences from production, and why:
#    - namespace moomento-dev, so a develop manifest applied to the production
#      cluster by mistake cannot overwrite production workloads
#    - no autoscaling component: the node has 2 vCPU / 3.7Gi and no headroom
#      for a second replica of anything
#    - no monitoring component: there is no Prometheus on this node, and the
#      ServiceMonitor CRD does not exist there
#    - smaller requests and limits (see patch-*.yaml)
#
#  Secrets are NEVER stored here - they come from Vault (see ../../vault/).
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Renaming this also requires updating, by hand:
#   - the router.middlewares annotation patch further down this file
#   - NAMESPACE in ../../vault/bootstrap-vault.example.sh when bootstrapping dev
namespace: moomento-dev

resources:
  - ../../base

# No components on purpose - see the header.

# -----------------------------------------------------------------------------
#  Container images. Rewritten automatically by .github/workflows/deploy.yml on
#  every push to develop; edit by hand only for a manual rollback:
#
#    cd k8s/overlays/develop
#    kustomize edit set image flashcards-backend=*:sha-1a2b3c4
# -----------------------------------------------------------------------------
images:
  - name: flashcards-backend
    newName: ghcr.io/path-of-execution-team/flashcards-backend
    newTag: "0.1.0"
  - name: flashcards-frontend
    newName: ghcr.io/path-of-execution-team/flashcards-gui
    newTag: "0.1.0"
  - name: flashcards-hosted
    newName: ghcr.io/path-of-execution-team/flashcards-hosted
    newTag: "0.1.0"

# The generated ConfigMap keeps kustomize's name suffix hash, so editing any
# value below rolls the pods on its own. `replacements` still resolves it by the
# pre-hash name `app-config`.
configMapGenerator:
  - name: app-config
    literals:
      # --- Public hostname --------------------------------------------------
      # Needs a Cloudflare A record dev.moomento.pl -> 57.128.251.9 before the
      # first apply, or the ACME http01 challenge will fail. This is the only
      # public hostname.
      - INGRESS_APP_HOST=dev.moomento.pl

      # --- Frontend ---------------------------------------------------------
      - NEXT_PUBLIC_API_URL=backend:8080
      - METRICS_BUCKETS=50,100,300,1000,2000,3000

      # --- Backend ----------------------------------------------------------
      - BACKEND_ALLOWED_ORIGINS=https://dev.moomento.pl
      - JWT_EXPIRATION=3600000

      # --- PostgreSQL (in-cluster on this node, provisioned by
      #     ../../provision/provision-dev-node.sh) ---------------------------
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql.database.svc.cluster.local:5432/flashcards
      - SPRING_DATASOURCE_USERNAME=flashcards_user
      # Smaller than production: one replica, and PostgreSQL runs on the same
      # 2 vCPU node.
      - BACKEND_DB_POOL_MAX=3
      - BACKEND_DB_POOL_MIN_IDLE=1
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

      # --- Kafka (single-node KRaft on this node) ---------------------------
      # Consumer groups are suffixed so that, if this environment is ever
      # pointed at a shared broker, it cannot steal production partitions.
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka.kafka.svc.cluster.local:9092
      - BACKEND_KAFKA_CONSUMER_GROUP_ID=flashcards-backend-dev
      - BACKEND_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - BACKEND_KAFKA_PRODUCER_ACKS=all
      - HOSTED_KAFKA_CONSUMER_GROUP_ID=hosted-service-group-dev
      - HOSTED_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - APP_KAFKA_DEMO_TOPIC=flashcards-demo-topic

      # --- Outbound mail ----------------------------------------------------
      - SPRING_MAIL_HOST=smtp.example.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true

patches:
  # Namespace-dependent value kustomize cannot derive on its own.
  - target:
      kind: Ingress
      name: frontend-metrics-deny
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: moomento-dev-deny-public@kubernetescrd
  # Vault roles/paths and the smaller resource envelope.
  - path: patch-backend.yaml
  - path: patch-hosted.yaml
  - path: patch-frontend.yaml

replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.INGRESS_APP_HOST
    targets:
      - select:
          kind: Ingress
          name: frontend
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: Ingress
          name: frontend-metrics-deny
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
