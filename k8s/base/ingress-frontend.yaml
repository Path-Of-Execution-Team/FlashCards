# Public entrypoint for the web application. The host below is a placeholder;
# each overlay's kustomization.yaml is the authoritative source and overwrites
# it via `replacements` from the app-config ConfigMap (INGRESS_APP_HOST).
#
# Create the DNS A record pointing at the target node BEFORE applying, otherwise
# the ACME http01 challenge cannot complete.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    app: frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - placeholder.invalid
      secretName: frontend-tls
  rules:
    - host: placeholder.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# The frontend serves Prometheus metrics on its public port at /metrics
# (rewritten to /api/metrics by next.config.ts). Traefik routers are ordered by
# rule length, so this longer PathPrefix(`/metrics`) rule wins over `/` above
# and the deny-public middleware keeps the endpoint off the internet.
# Prometheus is unaffected: it scrapes the ClusterIP Service directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-metrics-deny
  labels:
    app: frontend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Format is <namespace>-<middleware>@kubernetescrd. The kustomize
    # `namespace:` field does not rewrite annotation values, so every overlay
    # patches this key with its own namespace.
    traefik.ingress.kubernetes.io/router.middlewares: placeholder-deny-public@kubernetescrd
spec:
  ingressClassName: traefik
  # Reuses the certificate issued by the frontend Ingress above; no
  # cert-manager annotation here so the certificate is not requested twice.
  tls:
    - hosts:
        - placeholder.invalid
      secretName: frontend-tls
  rules:
    - host: placeholder.invalid
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# Allows only in-cluster source addresses. Applied to routes that must never be
# reachable from the internet.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-public
spec:
  ipAllowList:
    sourceRange:
      - 10.42.0.0/16
      - 10.43.0.0/16
