# k3s enforces NetworkPolicy by default (kube-router based controller), so these
# are live rules, not documentation.
#
# This is a default-deny model. If a pod suddenly cannot reach a dependency you
# added later, it is almost certainly missing an egress rule here. To disable
# the whole model temporarily, comment out networkpolicies.yaml in
# kustomization.yaml and re-apply.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Every pod needs cluster DNS before anything else works.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Public traffic from the ingress controller. Applies to all pods in the
# namespace on purpose: cert-manager creates temporary ACME http01 solver pods
# here during certificate issuance and Traefik must be able to reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
---
# Prometheus scraping of /actuator/prometheus and /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 3000
---
# The browser never calls the backend directly in the default setup: the Next.js
# server proxies /api/* in-cluster (see NEXT_PUBLIC_API_URL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-to-backend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-postgresql
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
---
# Kafka runs as shared infrastructure in its own namespace. Change the
# namespace label here if you place the broker somewhere else - the
# SPRING_KAFKA_BOOTSTRAP_SERVERS value in kustomization.yaml must match.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["backend", "hosted"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092
---
# Required by the injected vault-agent sidecar, which shares the pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["backend", "hosted"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
---
# Outbound mail to an external SMTP relay. Cluster CIDRs are excluded so this
# rule cannot be used to reach other in-cluster services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hosted-egress-smtp
spec:
  podSelector:
    matchLabels:
      app: hosted
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
